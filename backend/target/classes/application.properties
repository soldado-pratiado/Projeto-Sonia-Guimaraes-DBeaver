spring.application.name=sonia
server.port=8080
# Conforme o print do DBeaver: localhost:3306, root, senha em branco.
spring.datasource.url=jdbc:mysql://localhost:3306/sonia_guimaraes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
